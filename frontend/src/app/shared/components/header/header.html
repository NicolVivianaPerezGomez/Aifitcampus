<mat-toolbar
  class="bg-red-500 shadow-2xl flex flex-row justify-between items-center w-full px-4 header"
>
  <!-- Botón del menu -->
  <section class="left-side">
    <button mat-icon-button (click)="menuClick.emit()">
      <mat-icon>menu</mat-icon>
    </button>
  </section>

  <!-- información del perfil -->
  <button (click)="menuClick.emit()">
  <section class="right-side">
      <div class="img-container"></div>
      <div class="user-info">
        <span class="username">{{ userName() }}</span>
        <span class="user-detail">{{ userType() }}</span>
      </div>
  </section>
  </button>
</mat-toolbar>
